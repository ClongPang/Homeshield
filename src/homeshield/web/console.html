<!doctype html>
<!-- 子女控制台:链接即凭证(?token=),周报 + 成员管理(邀请码) + 告警(历史拉取 + SSE 增量) + 待确认纠正队列 -->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>家中盾 · 控制台</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; background: #10141a; color: #e8eaed; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 22px; } h2 { font-size: 16px; color: #9aa0a6; margin: 18px 0 6px; }
  .card { background: #1a2027; border-radius: 12px; padding: 14px; margin: 10px 0; line-height: 1.6; }
  .alert { border-left: 4px solid #e5534b; }
  .pending { border-left: 4px solid #d29922; }
  button { padding: 6px 12px; border: 0; border-radius: 8px; background: #2b6cb0; color: #fff; margin-right: 8px; margin-top: 8px; }
  .muted { color: #9aa0a6; font-size: 13px; }
  .meta { color: #9aa0a6; font-size: 13px; }
  input, select { background: #10141a; color: #e8eaed; border: 1px solid #30363d; border-radius: 8px; padding: 6px 10px; margin-right: 8px; }
  code { background: #10141a; padding: 2px 8px; border-radius: 6px; letter-spacing: 2px; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>家中盾 · 控制台</h1>
  <div class="card" id="weekly"></div>
  <h2>防护群成员</h2>
  <div id="family"><div class="card muted">加载中…</div></div>
  <div class="card" id="codeBox" style="display:none"></div>
  <div class="card" id="addBox" style="display:none">
    <div>添加家人</div>
    <div style="margin-top:6px">
      <input id="newName" placeholder="称呼,如:妈妈" maxlength="20" />
      <button onclick="addMember()">生成邀请码</button>
    </div>
    <div class="muted">生成后把「绑定 邀请码」发给家人:请 ta 关注公众号后回复即可加入。</div>
  </div>
  <h2>待确认的纠正</h2>
  <div id="queue"></div>
  <h2>高危告警</h2>
  <div id="alerts"><div class="card muted">暂无告警,等待推送…</div></div>
</div>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const label_name = (l) => (l === "false_positive" ? "说是误报" : "说是真骗局");

function showFatal(text) {
  document.getElementById("app").innerHTML = `<div class="card">${text}</div>`;
}

async function api(path) {
  const resp = await fetch(path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token));
  if (resp.status === 401) {
    showFatal("链接已失效,请让家人重新发一条链接");
    throw new Error("unauthorized");
  }
  if (!resp.ok) {
    showFatal("服务暂时不可用,请稍后再试");
    throw new Error("server error");
  }
  return resp.json();
}

const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, ...body }) });

function loadFamily() {
  api("/api/members").then(d => {
    const box = document.getElementById("family");
    box.innerHTML = "";
    document.getElementById("addBox").style.display = d.viewer_trusted ? "" : "none";
    for (const m of d.members) {
      const div = document.createElement("div");
      div.className = "card";
      const title = document.createElement("div");
      title.textContent = `${m.name}${m.id === d.viewer_id ? "(我)" : ""} · ${m.bound ? "已绑定微信" : "未绑定"}` +
        (m.trusted ? " · 可确认纠正" : "");
      div.append(title);
      if (d.viewer_trusted && !m.bound) {
        const b = document.createElement("button");
        b.textContent = "生成邀请码";
        b.onclick = () => reissue(m.id);
        div.append(b);
      }
      // 信任位按钮:不能操作自己(接口同样拒绝,防最后一个可管理者消失)
      if (d.viewer_trusted && m.id !== d.viewer_id) {
        if (m.trusted) {
          const t = document.createElement("button");
          t.textContent = "收回纠正信任";
          t.style.background = "#57606a";
          t.onclick = () => setTrust(m.id, false);
          div.append(t);
        } else {
          const t = document.createElement("button");
          t.textContent = "设为可确认纠正";
          t.onclick = () => setTrust(m.id, true);
          div.append(t);
        }
      }
      box.append(div);
    }
  }).catch(() => {});
}

function setTrust(memberId, trusted) {
  post(`/api/members/${memberId}/trust`, { trusted }).then(() => loadFamily());
}

// 创建/重发邀请码共用展示:码只在此处可见,接口不回传 token
function showCode(d) {
  const box = document.getElementById("codeBox");
  box.style.display = "";
  box.innerHTML = "";
  const line = document.createElement("div");
  const code = document.createElement("code");
  code.textContent = d.bind_code;
  line.append("邀请码:", code, ` (有效期至 ${new Date(d.bind_expires_at * 1000).toLocaleString()})`);
  const tip = document.createElement("div");
  tip.className = "muted";
  tip.textContent = `让 ta 关注公众号后回复:绑定 ${d.bind_code}`;
  const cp = document.createElement("button");
  cp.textContent = "复制绑定口令";
  cp.onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(`绑定 ${d.bind_code}`);
    cp.replaceWith("已复制 ✓");
  };
  box.append(line, tip, cp);
  if (d.entry_url) {
    const link = document.createElement("div");
    link.className = "muted";
    link.textContent = `或把网页链接直接发给 ta:${d.entry_url}`;
    box.append(link);
  }
}

function addMember() {
  const name = document.getElementById("newName").value.trim();
  if (!name) return;
  post("/api/members", { name }).then(async r => {
    if (r.status === 401) { showFatal("链接已失效,请让家人重新发一条链接"); throw new Error("unauthorized"); }
    if (r.status === 403) { showFatal("只有可确认纠正的成员可以管理家庭成员"); throw new Error("forbidden"); }
    if (!r.ok) { showCodeText("创建失败:" + ((await r.json().catch(() => ({}))).detail || "请稍后再试")); return; }
    showCode(await r.json());
    document.getElementById("newName").value = "";
    loadFamily();
  }).catch(() => {});
}

function reissue(memberId) {
  post(`/api/members/${memberId}/bind-code`, {}).then(async r => {
    if (r.status === 401) { showFatal("链接已失效,请让家人重新发一条链接"); throw new Error("unauthorized"); }
    if (!r.ok) { showCodeText("生成失败:" + ((await r.json().catch(() => ({}))).detail || "请稍后再试")); return; }
    showCode(await r.json());
  }).catch(() => {});
}

function showCodeText(text) {
  const box = document.getElementById("codeBox");
  box.style.display = "";
  box.textContent = text;
}

function loadWeekly() {
  api("/api/weekly").then(w => {
    document.getElementById("weekly").textContent =
      `近${w.days}天:查询 ${w.queries} 次 · 高危 ${w.dangerous} · 误报 ${w.false_positives} · 纠正 ${w.corrections}`;
  }).catch(() => {});
}

function loadQueue() {
  api("/api/corrections").then(d => {
    const box = document.getElementById("queue");
    box.innerHTML = "";
    if (!d.pending.length) {
      box.innerHTML = '<div class="card muted">没有等待确认的纠正。</div>';
      return;
    }
    for (const item of d.pending) {
      const div = document.createElement("div");
      div.className = "card pending";
      div.innerHTML = `<div>${item.by_name} ${label_name(item.label)}:</div>` +
        `<div>${item.content}</div>` +
        (item.note ? `<div class="meta">留言:${item.note}</div>` : "");
      if (d.viewer_trusted) {
        const ok = document.createElement("button");
        ok.textContent = "同意";
        ok.onclick = () => decide(item.id, "confirm");
        const no = document.createElement("button");
        no.textContent = "驳回";
        no.style.background = "#57606a";
        no.onclick = () => decide(item.id, "reject");
        div.append(ok, no);
      } else {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = "等待信任成员确认";
        div.append(meta);
      }
      box.append(div);
    }
  }).catch(() => {});
}

function decide(id, decision) {
  post(`/api/corrections/${id}/confirm`, { decision }).then(() => loadQueue());
}

// 历史与实时共用一张卡片;数据形状对齐 SSE payload(+ delivered_at 仅历史有)
function alertCard(a) {
  const div = document.createElement("div");
  div.className = "card alert";
  div.dataset.vid = a.verdict_id;
  const title = document.createElement("div");
  title.textContent = `高危 #${a.verdict_id}:${a.summary}`;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = a.delivered_at
    ? new Date(a.delivered_at * 1000).toLocaleString()
    : "刚刚";
  const b = document.createElement("button");
  b.textContent = "记录为误报";
  b.onclick = () =>
    post("/api/corrections", { verdict_id: a.verdict_id, label: "false_positive" })
      .then(() => { b.replaceWith("已记录 ✓"); loadQueue(); loadWeekly(); });
  div.append(title, meta, b);
  return div;
}

function loadAlerts() {
  api("/api/alerts").then(d => {
    const box = document.getElementById("alerts");
    // 合并式渲染:历史请求在途时 SSE 可能已插卡片,跳过已有的 verdict
    const fresh = d.alerts.filter(a => !box.querySelector(`[data-vid="${a.verdict_id}"]`));
    if (!fresh.length) return;
    if (box.querySelector(".muted")) box.innerHTML = "";
    for (const a of fresh) box.append(alertCard(a));
  }).catch(() => {});
}

const es = new EventSource(`/api/stream?token=${encodeURIComponent(token)}`);
es.onerror = () => {
  document.getElementById("alerts").innerHTML =
    '<div class="card muted">连接中断,自动重连中…</div>';
};
es.addEventListener("alert", e => {
  const a = JSON.parse(e.data);
  const box = document.getElementById("alerts");
  if (box.querySelector(".muted")) box.innerHTML = "";
  if (box.querySelector(`[data-vid="${a.verdict_id}"]`)) return; // 历史已在途,避免重复卡片
  box.prepend(alertCard(a));
});

loadFamily();
loadWeekly();
loadQueue();
loadAlerts();
</script>
</body>
</html>

<!doctype html><html lang="zh"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="referrer" content="no-referrer"/>
<title>高危提醒 · 家中盾</title><style>body{font-family:-apple-system,sans-serif;font-size:17px;margin:0;background:#f4f6f8;color:#20252b}.wrap{max-width:560px;margin:auto;padding:18px}h1{font-size:24px}.card{background:#fff;border-radius:12px;padding:16px;margin-top:14px;line-height:1.6}.meta,.muted{color:#687580;font-size:14px}.content{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f9fa;padding:12px;border-radius:8px;margin-top:8px}button{padding:12px 16px;font-size:16px;border:0;border-radius:9px;background:#1769aa;color:#fff;margin:8px 8px 0 0}.secondary{background:#e4eaf0;color:#24313c}</style></head>
<body><main class="wrap" id="app"><div class="card">加载中…</div></main><script>
const token=new URLSearchParams(location.search).get("token")||"",alertId=location.pathname.split("/").pop(),app=document.getElementById("app");let currentVerdictId=null,voting=false;const words={pending:"待投票",confirmed:"已确认",no_consensus:"未达共识",real:"真骗局",false_positive:"误报"};const word=v=>words[v]||v;const el=(t,s,c)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;if(c)n.className=c;return n};function show(s){app.replaceChildren(el("div",s,"card"))}
async function load(){try{const r=await fetch(`/api/alerts/${encodeURIComponent(alertId)}?token=${encodeURIComponent(token)}`);if(r.status===401)return show("个人链接无效，请在微信中回复「我的联防」重新取得链接。");if(r.status===404)return show("没有找到这条提醒。");if(r.status===410)return show("这条提醒对应的联防关系已解除，无法查看。");if(!r.ok)return show("服务暂时不可用，请稍后再试。");render(await r.json())}catch{show("网络出了点问题，请稍后再试")}}
function button(label,fn,cls=""){const b=el("button",label,cls);b.onclick=fn;return b}function render(d){currentVerdictId=d.verdict_id;app.replaceChildren(el("h1","⚠️ 高危提醒"),el("div",`#${d.relation_id} · ${d.name_at_alert}`,"meta"));const c=el("div",undefined,"card");c.append(el("b","查询内容"),el("div",d.content,"content"),el("div",d.reply,"content"));if(d.correction){const votes=d.correction.votes||{};c.append(el("p",`纠正状态：${word(d.correction.status)} · 真骗局 ${votes.real||0} 票、误报 ${votes.false_positive||0} 票；需 ${d.correction.required_votes}/${d.correction.eligible_count} 票。`));if(d.my_vote)c.append(el("p",`你的投票：${word(d.my_vote)}`))}if(d.level==="dangerous"&&(!d.correction||d.correction.status==="pending")&&!d.my_vote){c.append(el("p","每条联防关系一票；投票人数在纠正开启时固定。","muted"),button("是真骗局",()=>vote("real")),button("是误报",()=>vote("false_positive"),"secondary"))}app.append(c)}
async function vote(label){if(voting)return;voting=true;try{const r=await fetch("/api/corrections",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,verdict_id:currentVerdictId,label})});if(r.status===401)return voteNote("个人链接无效，请在微信中回复「我的联防」重新取得链接。");if(!r.ok){let d={};try{d=await r.json()}catch{};return voteNote(d.detail||"投票未能提交，请稍后重试。")}voteNote("");await load()}catch{voteNote("网络出了点问题，请稍后再试")}finally{voting=false}}
function voteNote(text){let n=document.getElementById("vote-note");if(!text){if(n)n.remove();return}if(!n){n=el("div","","card");n.id="vote-note";n.style.cssText="background:#fdecec;color:#8c2f2f";app.prepend(n)}n.textContent=text}
load();
</script></main></body></html>

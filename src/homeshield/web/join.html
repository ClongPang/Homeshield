<!doctype html><html lang="zh"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="referrer" content="no-referrer"/>
<title>加入联防 · 家中盾</title><style>body{font-family:-apple-system,sans-serif;margin:0;background:#f4f6f8;color:#20252b}main{max-width:520px;margin:auto;padding:22px}.card{background:#fff;border-radius:14px;padding:18px;margin-top:14px;line-height:1.65}h1{font-size:23px}code{display:inline-block;padding:9px 12px;background:#eef2f5;border-radius:8px;letter-spacing:2px;font-size:19px}button{padding:11px 16px;border:0;border-radius:9px;background:#1769aa;color:#fff;font-size:16px}.muted{color:#687580;font-size:14px}</style></head>
<body><main id="app"><div class="card">正在检查邀请…</div></main><script>
const code=decodeURIComponent(location.pathname.split("/").pop()||""),app=document.getElementById("app");const el=(t,s,c)=>{const n=document.createElement(t);if(s!==undefined)n.textContent=s;if(c)n.className=c;return n};

[project]
name = "homeshield"
version = "0.1.0"
description = "家中盾(Homeshield)——家庭反诈联防层"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "cryptography>=42",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
homeshield-cli = "homeshield.cli:main"
homeshield-kbcli = "homeshield.kbbuild.cli:main"
homeshield-eval = "homeshield.eval.run_eval:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeshield"]

[tool.uv]
package = true

[project]
name = "homeshield"
version = "0.1.0"
description = "家中盾(Homeshield)——家庭反诈联防层"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.scripts]
homeshield-cli = "homeshield.cli:main"
homeshield-kbcli = "homeshield.kbbuild.cli:main"
homeshield-eval = "homeshield.eval.run_eval:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeshield"]

[tool.uv]
package = true

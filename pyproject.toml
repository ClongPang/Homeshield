[project]
name = "homeshield"
version = "0.1.0"
description = "家中盾(Homeshield)——家庭反诈联防层"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
